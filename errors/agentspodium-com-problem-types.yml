  meaning: 'Unknown tier, engine below its minTier ("<Engine> requires at least the <tier> plan"), free-pod cap reached, a domain under agentspodium.com, a webhook URL that is not an absolute public https/http address (loopback, private ranges and credentials refused), or any other body validation failure.'
