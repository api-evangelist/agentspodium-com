summary: >-
  Four per-pod hosting plans, priced in USD monthly or yearly (yearly = ten months), read live from the public,
  unauthenticated GET /api/tiers, which the provider's own ai.txt names as "the price charged". Every pod starts with a
  7-day free trial with no card; free pods are capped at 3 per account. Model inference is never included — the customer
  installs their own LLM key. Payment is by card via Gumroad (verified path); USDT/USDC on Ethereum and Telegram Stars
  are documented as beta.
