openapi: 3.2.0
info:
  title: AgentsPodium account API (agent-facing subset) Agents API
  version: 1.0.0
  description: 'Create, configure, pay for and watch AI agent pods, meant to be driven directly by an agent. This document covers the subset an agent (rather than a human operator) needs: auth, agent lifecycle, tools/models/personas catalog, payment, A2A directory. See https://hosting.defispace.com/docs/quickstart.md for a narrative walkthrough.'
servers:
- url: https://agentspodium.com/api
security:
- bearerAuth: []
tags:
- name: Agents
  description: Create, configure, and operate a pod.
paths:
  /agents:
    get:
      summary: List every agent (pod) owned by this account
      tags:
      - Agents
      description: Call to enumerate your fleet, e.g. to find an id before acting on it.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agents
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: getAgents
      x-operation-id-source: derived
    post:
      summary: Create a new agent (deploy a pod)
      tags:
      - Agents
      description: 'Call once to provision a pod. The call is synchronous and returns once the pod exists, typically within one to two minutes — the engine inside may need a few more seconds, which GET /agents/{id}/liveness tells you. Follow with PATCH /agents/{id}/llm-key: a fresh pod has no model key and answers nothing until one is set.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - personaId
              - tier
              properties:
                personaId:
                  type: string
                  minLength: 1
                  description: Any id from GET /personas.
                tier:
                  type: string
                  enum:
                  - tiny
                  - small
                  - medium
                  - large
                  description: Must satisfy the chosen engine's minTier.
                name:
                  type: string
                  maxLength: 60
                  description: Up to 60 chars; the pod's hostnames are derived from it.
                channels:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                    - web
                    - telegram
                    - discord
                    - whatsapp
                    - email
                  description: Default ["web"].
                lang:
                  type: string
                  enum:
                  - en
                  - ru
                skills:
                  type: array
                  items:
                    type: string
                extraSoul:
                  type: string
                  maxLength: 4000
                  description: Owner instructions appended to the persona's SOUL.
                soul:
                  type: string
                  maxLength: 10000
                domain:
                  type: string
                  maxLength: 253
                  description: Your own hostname, e.g. agent.example.com. Names under agentspodium.com are assigned automatically and refused here.
                tools:
                  type: object
                  properties:
                    enabled:
                      type: array
                      items:
                        type: string
                    mcpServers:
                      type: array
                      items:
                        $ref: '#/components/schemas/McpServerConfig'
                engine:
                  type: string
                  enum:
                  - hermes
                  - openclaw
                  - n8n
                  - claude-code
                  - opencode
                  - pi
                  description: Default hermes.
                model:
                  type: string
                  maxLength: 200
                webhookUrl:
                  type: string
                  maxLength: 500
                  description: Public http(s) URL to POST pod events to. The signing secret comes back once as `webhookSecret` beside `agent`.
                app:
                  allOf:
                  - $ref: '#/components/schemas/AppConfig'
                  description: Required when engine is "app". Add repoToken (string) for a private repository; it is stored encrypted and never returned.
      responses:
        '200':
          description: Created — the pod exists and status is "running" (the engine inside may still be booting).
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
                  webhookSecret:
                    type: string
                    description: 'Only when `webhookUrl` was given: the HMAC secret for verifying deliveries. Shown once.'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: postAgents
      x-operation-id-source: derived
  /agents/{id}:
    get:
      summary: Read one agent's full record
      tags:
      - Agents
      description: Call to check current status, endpointUrl, a2a details, quota, and configuration.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: getAgentsById
      x-operation-id-source: derived
    delete:
      summary: Delete an agent for good
      tags:
      - Agents
      description: 'Call only when you are certain: this destroys the pod after a final backup and wipes every secret and every line the owner wrote. Export first (GET /agents/{id}/export) if the data might still be needed.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: deleteAgentsById
      x-operation-id-source: derived
  /agents/{id}/upgrade:
    post:
      summary: Change an agent's plan
      tags:
      - Agents
      description: Call to move the pod to a different tier; it rebuilds with data migrated. Poll GET /agents/{id} until status is "running" afterward.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tier
              properties:
                tier:
                  type: string
                  enum:
                  - tiny
                  - small
                  - medium
                  - large
      responses:
        '200':
          description: Upgraded — status is "provisioning" while the pod rebuilds.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: postAgentsByIdUpgrade
      x-operation-id-source: derived
  /agents/{id}/llm-key:
    patch:
      summary: Install, change, or clear the agent's model key
      tags:
      - Agents
      description: 'Call right after creating an agent — without a key it accepts messages and answers nothing. Send `key: null` to clear it. This rebuilds the pod (about a minute); poll liveness again afterward.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                  minLength: 8
                  nullable: true
                  description: The provider's API key; null clears it.
                provider:
                  type: string
                  enum:
                  - openai
                  - anthropic
                  - openrouter
                  - google
                  - gemini
                  - groq
                  - mistral
                  - deepseek
                  - xai
                  - nous
                  description: Required together with a non-null key; a key for one vendor and a model from another is a dead pod.
                model:
                  type: string
                  maxLength: 200
                  nullable: true
      responses:
        '200':
          description: Saved — status is "provisioning" while the pod rebuilds.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdLlmKey
      x-operation-id-source: derived
  /agents/{id}/tools:
    patch:
      summary: Set the agent's enabled toolsets and MCP servers
      tags:
      - Agents
      description: Call with the full desired set (this replaces, not merges) after checking valid ids via GET /tools. Rebuilds the pod.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: array
                  items:
                    type: string
                mcpServers:
                  type: array
                  items:
                    $ref: '#/components/schemas/McpServerConfig'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdTools
      x-operation-id-source: derived
  /agents/{id}/channels:
    patch:
      summary: Set which messengers the agent listens on
      tags:
      - Agents
      description: Call with the full desired channel list (at least one).
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - channels
              properties:
                channels:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                    - web
                    - telegram
                    - discord
                    - whatsapp
                    - email
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdChannels
      x-operation-id-source: derived
  /agents/{id}/telegram:
    patch:
      summary: Install or clear the agent's Telegram bot token
      tags:
      - Agents
      description: 'Call with a bot token from @BotFather to enable the Telegram channel; send `token: null` to clear it. The token is encrypted at rest and never returned by any endpoint.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                  nullable: true
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdTelegram
      x-operation-id-source: derived
  /agents/{id}/instructions:
    patch:
      summary: Set the owner's extra instructions appended to the persona
      tags:
      - Agents
      description: 'Call to change extraSoul; send `extraSoul: null` to clear it back to the plain persona.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extraSoul:
                  type: string
                  maxLength: 4000
                  nullable: true
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdInstructions
      x-operation-id-source: derived
  /agents/{id}/timezone:
    patch:
      summary: Set the IANA timezone the agent's schedules run on
      tags:
      - Agents
      description: 'Call to fix wrong-hour cron jobs and reminders; send `timezone: null` to fall back to the pod''s UTC default. Wrong or missing timezone fails silently — schedules simply fire at the wrong hour.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - timezone
              properties:
                timezone:
                  type: string
                  maxLength: 64
                  nullable: true
                  example: Europe/Berlin
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdTimezone
      x-operation-id-source: derived
  /agents/{id}/peers:
    put:
      summary: Replace the list of other agents this one may call over A2A
      tags:
      - Agents
      description: 'Call with the full desired peer list (up to 20) — this replaces, not merges. Peer tokens are other people''s secrets: accepted here, encrypted at rest, and never sent back out. Written into the pod on rebuild.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - peers
              properties:
                peers:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required:
                    - name
                    - url
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 64
                      url:
                        type: string
                        format: uri
                        maxLength: 500
                      token:
                        type: string
                        minLength: 1
                        maxLength: 500
                        description: The peer's own bearer credential.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: putAgentsByIdPeers
      x-operation-id-source: derived
  /agents/{id}/listing:
    patch:
      summary: Opt an agent into (or out of) the public A2A catalog
      tags:
      - Agents
      description: 'Call with `listed: true` to make this pod discoverable at GET /a2a-catalog (name, url, agent card — never the token); `false` to remove it. Off by default — enabling the a2a toolset is not consent to being listed.'
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listed:
                  type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: patchAgentsByIdListing
      x-operation-id-source: derived
  /agents/{id}/pause:
    post:
      summary: Pause an agent (stop billing its resources)
      tags:
      - Agents
      description: Call to stop a pod without losing its data; resume later with POST /agents/{id}/resume.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '200':
          description: Paused — status is "stopped".
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: postAgentsByIdPause
      x-operation-id-source: derived
  /agents/{id}/resume:
    post:
      summary: Resume a paused agent
      tags:
      - Agents
      description: Call to bring a stopped pod back; poll GET /agents/{id}/liveness afterward.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '200':
          description: Resumed — status is "running".
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: postAgentsByIdResume
      x-operation-id-source: derived
  /agents/{id}/rebuild:
    post:
      summary: Rebuild the pod from its last backup
      tags:
      - Agents
      description: Call when liveness shows reachable but not serving for more than a few minutes, or after status is "failed". Poll GET /agents/{id} until "running", then liveness.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '200':
          description: Rebuild started — status is "provisioning".
          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request — the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: postAgentsByIdRebuild
      x-operation-id-source: derived
  /agents/{id}/liveness:
    get:
      summary: Check whether the pod is up and the engine inside is answering
      tags:
      - Agents
      description: Poll every 5 seconds after create, upgrade, an llm-key change, or a rebuild, until `serving` is true. `reachable && !serving` for more than a few minutes means broken — call POST /agents/{id}/rebuild.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        '401':
          description: Missing, invalid, expired, or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such agent, key, or persona for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: getAgentsByIdLiveness
      x-operation-id-source: derived
  /agents/{id}/usage:
    get:
      summary: Read the agent's current RAM/disk usage against its plan
      tags:
      - Agents
      description: Call to check whether an agent is close to being auto-paused for exceeding its tier (quotaStatus reaches "paused"). Numbers refresh about once a minute from the cluster.
      parameters:
      - name: id
        in: path
        required: true
        description: Agent id (agt_…).
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                - usage
                - status
