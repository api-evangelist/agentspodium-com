components:
  schemas:
    AppConfig:
      type: object
      description: 'Build and run configuration for engine "app": a customer repository served as frontend plus backend on one pod.'
      required:
      - repo
      - branch
      - appPort
      - apiPrefix
      properties:
        repo:
          type: string
          example: https://github.com/owner/project
          description: Public https git URL. Private repositories need repoToken on create.
        branch:
          type: string
          default: main
        runtime:
          type: string
          nullable: true
          enum:
          - node
          - python
          - go
          - static
          - docker
          - null
          description: Omit and the pod detects it from the repository.
        buildCommand:
          type: string
          nullable: true
          example: npm ci && npm run build
        outputDir:
          type: string
          nullable: true
          example: dist
          description: Static output, relative to rootDir; null means no static half.
        startCommand:
          type: string
          nullable: true
          example: node server.js
          description: Backend process; null means a static-only app.
        appPort:
          type: integer
          default: 3000
          description: Port the backend listens on inside the pod.
        apiPrefix:
          type: string
          default: /api
          description: Paths routed to the backend; everything else is served from outputDir.
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the app. Not for secrets.
        rootDir:
          type: string
          nullable: true
          example: app
          description: Directory inside the repository where the build runs. For a monorepo whose app is not at the root. Netlify calls this "base".
        repoUser:
          type: string
          nullable: true
          description: 'Username paired with repoToken when the host wants one. Left out, we use what the host expects: x-access-token for GitHub, oauth2 for GitLab, the token alone for Gitea and Forgejo.'
    AgentQuota:
      type: object
      description: Latest RAM/disk snapshot for a pod, refreshed about once a minute from the cluster.
      required:
      - memoryUsedBytes
      - memoryLimitBytes
      - memoryPct
      - diskUsedBytes
      - diskTotalBytes
      - diskPct
      - status
      - updatedAt
      properties:
        memoryUsedBytes:
          type:
          - integer
          - 'null'
        memoryLimitBytes:
          type:
          - integer
          - 'null'
        memoryPct:
          type:
          - number
          - 'null'
          description: memoryUsedBytes / memoryLimitBytes, or null when either side is unknown.
        diskUsedBytes:
          type:
          - integer
          - 'null'
        diskTotalBytes:
          type:
          - integer
          - 'null'
        diskPct:
          type:
          - number
          - 'null'
        status:
          type: string
          enum:
          - ok
          - warn
          - grace
          - paused
          description: paused means the pod was auto-stopped for exceeding its plan.
        updatedAt:
          type: string
          format: date-time
    BackupEntry:
      type: object
      required:
      - name
      - size
      - createdAt
      properties:
        name:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
    Agent:
      type: object
      description: One pod. Serialized with the engine encryption key and the plaintext-adjacent LLM key ciphertext stripped; every other stored field is returned as is.
      required:
      - id
      - userId
      - personaId
      - name
      - tier
      - channels
      - createdAt
      - status
      - dseq
      - endpointUrl
      - llmKeyHash
      - dashUsername
      - dashPassword
      - quotaStatus
      - quota
      - lang
      - domain
      - tools
      - llmProvider
      - lastBackupAt
      - model
      - engine
      - timezone
      - a2aToken
      - a2aUrl
      - extraSoul
      - a2aPeers
      - a2aSlug
      - trialNoticeDay
      - telegramTokenEnc
      - a2aListed
      properties:
        id:
          type: string
          example: agt_…
        userId:
          type: string
        personaId:
          type: string
        name:
          type: string
        tier:
          type: string
          enum:
          - tiny
          - small
          - medium
          - large
        channels:
          type: array
          items:
            type: string
            enum:
            - web
            - telegram
            - discord
            - whatsapp
            - email
        createdAt:
          type: string
          format: date-time
          description: The free trial is counted from here.
        status:
          type: string
          enum:
          - provisioning
          - running
          - stopped
          - failed
          - deleted
        dseq:
          type:
          - string
          - 'null'
          description: Akash deployment sequence (the pod's namespace), set after a successful deploy.
        endpointUrl:
          type:
          - string
          - 'null'
          format: uri
          description: The engine's own public URL/dashboard.
        llmKeyHash:
          type:
          - string
          - 'null'
          description: sha256 of the configured LLM key; set once a key is installed.
        dashUsername:
          type:
          - string
          - 'null'
          description: Login for the engine's own dashboard, when the engine has one.
        dashPassword:
          type:
          - string
          - 'null'
        quotaStatus:
          type: string
          enum:
          - ok
          - warn
          - grace
          - paused
        quota:
          anyOf:
          - $ref: '#/components/schemas/AgentQuota'
          - type: 'null'
        lang:
          type: string
          enum:
          - en
          - ru
          description: Propagated into the persona's SOUL.
        domain:
          type:
          - string
          - 'null'
          description: The customer's own hostname if set, otherwise null (the pod still answers at <a2aSlug>.agentspodium.com).
        tools:
          anyOf:
          - $ref: '#/components/schemas/AgentTools'
          - type: 'null'
        llmProvider:
          type:
          - string
          - 'null'
          enum:
          - openai
          - anthropic
          - openrouter
          - google
          - gemini
          - groq
          - mistral
          - deepseek
          - xai
          - nous
          - null
        lastBackupAt:
          type:
          - string
          - 'null'
          format: date-time
        model:
          type:
          - string
          - 'null'
          description: Model catalog id, e.g. anthropic:claude-sonnet-4-5.
        engine:
          type: string
          enum:
          - hermes
          - openclaw
          - n8n
          - claude-code
          - opencode
          - pi
        timezone:
          type:
          - string
          - 'null'
          description: IANA zone, e.g. Europe/Berlin. Null means the pod's UTC default.
        a2aToken:
          type:
          - string
          - 'null'
          description: Bearer peers must send to this agent's A2A endpoint. Null when the a2a toolset is off.
        a2aUrl:
          type:
          - string
          - 'null'
          format: uri
        extraSoul:
          type:
          - string
          - 'null'
          description: The owner's own additions appended to the persona's SOUL.
        a2aPeers:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/A2aPeerPublic'
          - type: 'null'
        a2aSlug:
          type:
          - string
          - 'null'
          description: Stable label every one of this agent's hostnames is built from.
        trialNoticeDay:
          type:
          - integer
          - 'null'
          description: 'Which trial reminder has already gone out: 3, 2, 1, or 0 for paused.'
        telegramTokenEnc:
          type:
          - string
          - 'null'
          description: '"set" when a Telegram bot token is stored for this agent, otherwise null. The token itself never leaves the server.'
        a2aListed:
          type: boolean
          description: Whether the owner opted into the public A2A catalog (GET /a2a-catalog).
        webhookUrl:
          type: string
          nullable: true
          description: Receiver for pod events, or null. Set with PUT /agents/{id}/webhook or `webhookUrl` on create.
        webhookLastStatus:
          type: string
          nullable: true
          description: 'Outcome of the latest delivery: the HTTP status (`200`) or `error: …`.'
        webhookLastAt:
          type: string
          format: date-time
          nullable: true
        webhookLastEvent:
          type: string
          nullable: true
          description: Type of the latest delivered event.
        app:
          allOf:
          - $ref: '#/components/schemas/AppConfig'
          nullable: true
          description: Set only when engine is "app".
        appRepoTokenEnc:
          type: string
          nullable: true
          enum:
          - set
          - null
          description: '"set" when a private-repository token is stored; the token itself never leaves the server.'
    ApiError:
      type: object
      description: Uniform error body sent by the global error handler for every 4xx/5xx response.
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Stable machine code, e.g. BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, INVALID_CODE, INTERNAL.
        message:
          type: string
          description: Human-readable reason, safe to show to whoever is driving the agent.
    BuildStatus:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - building
          - ok
          - failed
          - unknown
        commit:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        logTail:
          type: string
          nullable: true
          description: Last lines of the build log.
    DomainCheck:
      type: object
      required:
      - domain
      - expectedIp
      - dns
      - https
      properties:
        domain:
          type: string
        expectedIp:
          type: string
          description: The address the customer's A record has to carry.
        dns:
          type: object
          required:
          - status
          - addresses
          properties:
            status:
              type: string
              enum:
              - ok
              - unresolved
              - elsewhere
            addresses:
              type: array
              items:
                type: string
        https:
          type: object
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - ok
              - error
              - skipped
              description: skipped when DNS does not point here yet, or when the caller did not ask for the HTTPS probe.
    Liveness:
      type: object
      required:
      - reachable
      - serving
      properties:
        reachable:
          type:
          - boolean
          - 'null'
          description: The cluster says the pod exists and is ready. Null when there is no address yet.
        serving:
          type:
          - boolean
          - 'null'
          description: An HTTP request to the pod's address returned something below 5xx. Null when the connection itself failed.
    WebhookDelivery:
      type: object
      required:
      - ok
      - status
      - attempts
      properties:
        ok:
          type: boolean
        status:
          type: integer
          nullable: true
          description: HTTP status of the last attempt, or null when the receiver was unreachable.
        attempts:
          type: integer
        error:
          type: string
    AgentTerm:
      type: object
      description: The one answer to when this agent's current term ends.
      required:
      - mode
      - stopsAt
      - deletesAt
      - paidTill
      - paidProvider
      - renewUrl
      properties:
        mode:
          type: string
          enum:
          - trial
          - grace
          - paid
          - internal
        stopsAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When a free agent's pod is paused (trial/grace only).
        deletesAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When a free agent is deleted for good (trial/grace only).
        paidTill:
          type:
          - string
          - 'null'
          format: date-time
          description: End of the current paid period (paid only).
        paidProvider:
          type:
          - string
          - 'null'
        renewUrl:
          type: string
          format: uri
          description: Where a human pays to renew this agent.
    A2aPeerPublic:
      type: object
      description: Another A2A agent this one may call by name. The peer's bearer token is write-only and never serialized back.
      required:
      - name
      - url
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
    AgentTools:
      type: object
      description: Enabled Hermes toolsets and user-defined MCP servers.
      required:
      - enabled
      - mcpServers
      properties:
        enabled:
          type: array
          items:
            type: string
          description: Toolset ids from GET /tools; empty means the safe minimal set.
        mcpServers:
          type: array
          items:
            $ref: '#/components/schemas/McpServerConfig'
    AgentMemory:
      type: object
      description: Read-only view of a Hermes agent's persona data.
      required:
      - soul
      - skills
      - memories
      - sessionsCount
      properties:
        soul:
          type: string
        skills:
          type: array
          items:
            type: string
        memories:
          type: array
          items:
            type: object
            required:
            - name
            - content
            properties:
              name:
                type: string
              content:
                type: string
        sessionsCount:
          type: integer
    McpServerConfig:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Unique server name; used as the server:tool prefix in Hermes.
        command:
          type: string
          description: 'Stdio transport: executable to spawn.'
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        url:
          type: string
          format: uri
          description: 'HTTP transport: MCP endpoint URL.'
        headers:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key `ak_live_…` created on the account page, or a session token from /auth/verify.
