source: >-
  Derived by binding the live MCP tools/list (mcp/agentspodium-com-tools-list.json, 13 tools, fetched anonymously
  2026-09-19) and the A2A agent card's five skills (a2a/agentspodium-com-agent-card.json) to the account API OpenAPI
  (openapi/agentspodium-com-openapi.yml, 52 operations). The gateway source (github.com/agentspodium/agent-gateway,
  src/tools.ts / src/a2a-commands.ts) and docs/mcp.md describe each tool as "one API request on your behalf", which is
  what the bindings below record.
purpose: >-
  Make the MCP tool and the A2A skill first-class discovery units bound to the machine-readable core. AgentsPodium's three
  surfaces are projections of ONE account API; MCP and A2A cover the operator's happy path (choose, deploy, wire a key,
  watch, pay, connect) and REST alone carries the long tail (backups, export, memory, channels, instructions, domain
  checks, crypto/Stars orders, API-key management).
operation_id_note: >-
  The provider's OpenAPI declares NO operationId on any of its 52 operations, so rest[] rows below name operations by
  "METHOD /path" exactly as they appear in the spec. overlays/agentspodium-com-openapi-overlay.yaml proposes operationIds
  for every operation; the same names are given in rest_operation_ids[] for readers applying that overlay.
surfaces:
  rest_openapi: openapi/agentspodium-com-openapi.yml            # 52 operations, 31 schemas, bearer ak_live_ key; public: /engines /tiers /personas /tools /models /llm-providers /status /a2a-catalog /auth/*
  mcp: https://mcp.agentspodium.com/mcp                          # tools/list OPEN (anonymous 200 with full inputSchema); tools/call key-gated except list_platforms
  a2a: https://a2a.agentspodium.com/hosting/                     # card public; list-platforms answers anonymously (probed); other skills need the key
  graphql: null
