aid: agentspodium-com
name: AgentsPodium
description: >-
  AgentsPodium runs personal AI agents around the clock, each on its own pod with its own memory and files, answering in
  the owner's messenger. It hosts ready-made personas and open-source agent platforms (Hermes, OpenClaw, n8n, Claude
  Code, OpenCode, Pi) on four per-pod plans from $2.49 a month with a 7-day free trial; the model key is the customer's
  own. The same service is driven by agents through an HTTP account API (OpenAPI 3.1, 52 operations, bearer API key), a
  hosted MCP server with 13 tools, an A2A agent with five skills, four published Agent Skills, and signed webhooks. The
  developer documentation lives on the operator's second brand, DefiSpace Hosting (hosting.defispace.com); the company
  behind both is Radiance Team.
