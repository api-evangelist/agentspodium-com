apis:
- aid: agentspodium-com:account-api
  name: AgentsPodium Account API
  description: >-
    The HTTP API behind the AgentsPodium dashboard, published as an agent-facing subset (OpenAPI 3.1.0, 52 operations):
    passwordless sign-in and API keys, the public catalog of personas, tiers, engines, tools and models, the full pod
    lifecycle (create, upgrade, configure model key / tools / channels / instructions / peers, pause, resume, rebuild,
    delete), health and quota, backups and export, payment by card, USDT/USDC or Telegram Stars, signed webhooks, custom
    domains and the public A2A directory. Bearer ak_live_ key or 30-day session token; eleven operations are public.
  image: https://agentspodium.com/og.png
