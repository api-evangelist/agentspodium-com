- aid: agentspodium-com:a2a-agent
  name: AgentsPodium Hosting A2A Agent
  description: >-
    The hosting service as an A2A agent (protocol 0.3.0, JSON-RPC message/send at https://a2a.agentspodium.com/hosting/)
    with five skills — create-instance, instance-health, instance-term, list-platforms, payment-options — each callable
    with a structured data part or a one-line text command. list-platforms and help answer without a key; account
    skills need the caller's ak_live_ API key (JSON-RPC error -32001 without it). The same host is the platform's agent
    directory: /catalog.json lists opted-in customer pods and /agent/<slug>/ routes to each pod's own A2A endpoint.
  image: https://agentspodium.com/og.png
  humanURL: https://hosting.defispace.com/docs/a2a.html
