- aid: agentspodium-com:mcp-server
  name: AgentsPodium Hosting MCP Server
  description: >-
    Hosted, agent-native MCP server (Streamable HTTP, protocol 2025-06-18, server agentspodium-hosting 1.0.4) exposing
    hosting as 13 tools — list_platforms, list_instances, create_instance, get_instance_health, get_instance_term,
    set_llm_key, pause/resume/rebuild/delete_instance, get_payment_options, set_peers, set_webhook — plus a
    deploy-checklist prompt and an agentspodium://docs resource. tools/list answers anonymously with full input and
    output schemas and safety annotations; every account tool needs the caller's ak_live_ API key. Stateless: each call
    is one account-API request on the caller's behalf. Source: github.com/agentspodium/agent-gateway.
  image: https://agentspodium.com/og.png
  humanURL: https://hosting.defispace.com/docs/mcp.html
  baseURL: https://mcp.agentspodium.com/mcp
