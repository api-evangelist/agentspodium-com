discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: a2a.agentspodium.com
  note: >-
    The canonical path on the primary domain is a redirect, not a miss: https://agentspodium.com/.well-known/agent-card.json,
    https://www.agentspodium.com/... and https://app.agentspodium.com/... each answer 302 Location
    https://a2a.agentspodium.com/hosting/.well-known/agent-card.json, and https://mcp.agentspodium.com/.well-known/agent-card.json
    serves the same 3,216-byte body directly (200). The card therefore lives at a path prefix (/hosting/) on the dedicated A2A
    host, which is the provider's own choice of layout; the primary domain points at it. The legacy /.well-known/agent.json
    is a real JSON 404 ({"error":"NOT_FOUND"}, 21 bytes) on every agentspodium.com host, and a negative-control path
    (/.well-known/agentspodium-com-negative-control-7f3ab91c.json) 404s on all of them, so the 200 is a served document and
    not a catch-all. Ownership is not in question: provider.organization is "AgentsPodium", securitySchemes describe the
    ak_live_ key issued at https://agentspodium.com/account, and the provider's own llms.txt, ai.txt, faq-ai.txt and
    developer-ai.txt on agentspodium.com all name this exact card URL. provider.url and documentationUrl point at
    hosting.defispace.com, which AgentsPodium's brand.txt identifies as "DefiSpace Hosting ... run by the same team" and
    its llms.txt names as the developer docs host.
